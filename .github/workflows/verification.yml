# Formal verification + cocotb CI for b8008.
# Everything runs through the top-level Makefile pattern rules:
#   formal-<module>       -> sby (all tasks in formal/<module>/<module>.sby)
#   eqy-<module>          -> write_vhdl round trip vs RTL equivalence
#   cocotb-<module>       -> python testbench under sim/cocotb
# Toolchain comes from one oss-cad-suite bundle installed to $HOME/oss-cad-suite
# (see .github/actions/setup-oss-cad-suite), matching the Makefile's paths.
name: verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Classic GHDL unit testbenches (no .mem programs needed; the asm
  # regression suite is NOT here: it requires the ASL assembler and
  # assembled .mem artifacts that are not committed).
  unit:
    name: unit testbenches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Run all unit testbenches
        run: make test-units

  sby:
    name: sby ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: stack_pointer
          - module: state_timing_generator
          - module: machine_cycle_control
          - module: condition_flags
          # Miter proves RTL == gate netlist; needs the gate-renamed
          # write_vhdl netlist in build/synth first.
          - module: stack_pointer_miter
            prep: netlist-gate-stack_pointer
          - module: alu_miter
            prep: netlist-gate-alu
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Build prerequisite netlist
        if: matrix.prep
        run: make ${{ matrix.prep }}
      - name: Run sby proofs
        run: make formal-${{ matrix.module }}
      - name: Upload sby workdirs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sby-${{ matrix.module }}
          path: formal/${{ matrix.module }}
          if-no-files-found: ignore

  eqy:
    name: eqy ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Combinational modules only: EQY is sound there. Sequential
        # round trips (e.g. stack_pointer) hit write_vhdl's vector-flop
        # splitting, which breaks EQY state matching and yields spurious
        # partition FAILs (verified 2026-08-07, splitnets does not help);
        # those are proven by the SBY miter in the sby job instead.
        module: [carry_lookahead, sss_ddd_selector, scratchpad_decoder, instruction_decoder]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      # eqy-% depends on netlist-vhdl-%, so the round-trip netlist
      # is built automatically.
      - name: Run eqy equivalence check
        run: make eqy-${{ matrix.module }}
      - name: Upload eqy workdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eqy-${{ matrix.module }}
          path: build/eqy/${{ matrix.module }}
          if-no-files-found: ignore

  cocotb:
    name: cocotb ${{ matrix.module }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [stack_pointer, instruction_decoder]
        variant: [rtl, netlist]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Build round-trip netlist DUT
        if: matrix.variant == 'netlist'
        run: make netlist-vhdl-${{ matrix.module }}
      - name: Run cocotb testbench
        run: make cocotb-${{ matrix.module }} DUT_VARIANT=${{ matrix.variant }}
      - name: Upload cocotb results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-${{ matrix.module }}-${{ matrix.variant }}
          path: |
            sim/cocotb/results.xml
            sim/cocotb/*.ghw
            sim/cocotb/sim_build
          if-no-files-found: ignore
