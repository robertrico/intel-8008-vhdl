# Formal verification + cocotb CI for b8008.
# Everything runs through the top-level Makefile pattern rules:
#   formal-<module>       -> sby (all tasks in formal/<module>/<module>.sby)
#   eqy-<module>          -> write_vhdl round trip vs RTL equivalence
#   cocotb-<module>       -> python testbench under sim/cocotb
# Toolchain comes from one oss-cad-suite bundle installed to $HOME/oss-cad-suite
# (see .github/actions/setup-oss-cad-suite), matching the Makefile's paths.
name: verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Full-system assembly regression suite: every check_*.sh assembles
  # its program (ASL built by setup-asl; .mem stays uncommitted) and
  # runs it on the complete CPU in GHDL. The netlist variant swaps in
  # the write_vhdl round-trip core (B8008_CORE=netlist).
  regression:
    name: regression suite (${{ matrix.core }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        core: [rtl, netlist]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - uses: ./.github/actions/setup-asl
      - name: Run regression suite
        run: B8008_CORE=${{ matrix.core }} ./test_programs/verification_scripts/run_all_tests.sh
      - name: Upload simulation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.core }}-logs
          path: test_programs/verification_scripts/*.log
          if-no-files-found: ignore

  # Classic GHDL unit testbenches (no .mem programs needed).
  unit:
    name: unit testbenches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Run all unit testbenches
        run: make test-units

  sby:
    name: sby ${{ matrix.module }}
    runs-on: ubuntu-latest
    # stack_memory_miter overrides: its bmc runs ~13 min on a fast
    # laptop, the hosted runner needs more headroom.
    timeout-minutes: ${{ matrix.timeout || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: stack_pointer
          - module: state_timing_generator
          - module: machine_cycle_control
          - module: condition_flags
          - module: register_file
          - module: stack_memory
          - module: instruction_register
          - module: temp_registers
          - module: interrupt_ready_ff
          - module: ahl_pointer
          - module: mcc_stg_cluster
          # Miter proves RTL == gate netlist; needs the gate-renamed
          # write_vhdl netlist in build/synth first.
          - module: stack_pointer_miter
            prep: netlist-gate-stack_pointer
          - module: alu_miter
            prep: netlist-gate-alu
          - module: register_file_miter
            prep: netlist-gate-register_file
          - module: stack_memory_miter
            prep: netlist-gate-stack_memory
            timeout: 60
          - module: instruction_register_miter
            prep: netlist-gate-instruction_register
          - module: temp_registers_miter
            prep: netlist-gate-temp_registers
          - module: interrupt_ready_ff_miter
            prep: netlist-gate-interrupt_ready_ff
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - name: Build prerequisite netlist
        if: matrix.prep
        run: make ${{ matrix.prep }}
      - name: Run sby proofs
        run: make formal-${{ matrix.module }}
      - name: Upload sby workdirs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sby-${{ matrix.module }}
          path: formal/${{ matrix.module }}
          if-no-files-found: ignore

  eqy:
    name: eqy ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Combinational modules only: EQY is sound there. Sequential
        # round trips (e.g. stack_pointer) hit write_vhdl's vector-flop
        # splitting, which breaks EQY state matching and yields spurious
        # partition FAILs (verified 2026-08-07, splitnets does not help);
        # those are proven by the SBY miter in the sby job instead.
        module: [carry_lookahead, scratchpad_decoder, instruction_decoder,
                 ahl_pointer, io_buffer, mem_mux_refresh]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      # eqy-% depends on netlist-vhdl-%, so the round-trip netlist
      # is built automatically.
      - name: Run eqy equivalence check
        run: make eqy-${{ matrix.module }}
      - name: Upload eqy workdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eqy-${{ matrix.module }}
          path: build/eqy/${{ matrix.module }}
          if-no-files-found: ignore

  cocotb:
    name: cocotb ${{ matrix.module }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [stack_pointer, instruction_decoder, memory_io_control]
        variant: [rtl, netlist]
        include:
          # Whole-system bus-protocol monitor (rtl only; needs its two
          # program ROMs assembled)
          - module: b8008_top
            variant: rtl
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-oss-cad-suite
      - uses: ./.github/actions/setup-asl
        if: matrix.module == 'b8008_top'
      - name: Assemble monitor program ROMs
        if: matrix.module == 'b8008_top'
        run: make assemble PROG=memory_alu_test_as.asm && make assemble PROG=io_test_as.asm
      - name: Build round-trip netlist DUT
        if: matrix.variant == 'netlist'
        run: make netlist-vhdl-${{ matrix.module }}
      - name: Run cocotb testbench
        run: make cocotb-${{ matrix.module }} DUT_VARIANT=${{ matrix.variant }}
      - name: Upload cocotb results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-${{ matrix.module }}-${{ matrix.variant }}
          path: |
            sim/cocotb/results.xml
            sim/cocotb/*.ghw
            sim/cocotb/sim_build
          if-no-files-found: ignore
